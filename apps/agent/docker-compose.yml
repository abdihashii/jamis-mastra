name: jamis

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mastra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'

  clickhouse:
    # Exact pin. ClickHouse versions are calendar-based (26.7 is July 2026), so
    # every monthly release is a feature release that can change on-disk formats,
    # and a data directory cannot be downgraded. Bump this deliberately, never by
    # letting a tag drift, or a redeploy can strand the chdata volume.
    image: clickhouse/clickhouse-server:26.7.3.19
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password}
    volumes:
      - chdata:/var/lib/clickhouse
    ports:
      - '127.0.0.1:8123:8123'

volumes:
  pgdata:
  chdata:
