# Prod overlay. Always applied on top of docker-compose.yml, never alone:
#
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# infra/deploy.sh runs that for you. Run it by hand only to debug.
name: jamis

services:
  postgres:
    # Drops the dev 127.0.0.1 binding. Nothing outside the compose network
    # reaches the databases in prod.
    ports: !reset []

  clickhouse:
    ports: !reset []
    volumes:
      - ./clickhouse/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro

  app:
    build:
      context: ../..
      dockerfile: apps/agent/Dockerfile
    env_file: .env.prod
    depends_on: [postgres, clickhouse]
    # Loopback only. tailscale serve publishes it to the tailnet, so no routable
    # interface is bound and no env var can widen it. See plan 001, Q6.
    ports:
      - '127.0.0.1:4111:4111'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    # Reaches the app at http://app:4111 over the compose network, so the tunnel
    # needs no published port. Restart-loops if TUNNEL_TOKEN is blank; the rest
    # of the stack is unaffected.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on: [app]
    restart: unless-stopped
